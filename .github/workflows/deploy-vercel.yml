name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CalculadoraArancelesCAO.slnx

      - name: Build and Publish
        run: dotnet publish src/CalculadoraArancelesCAO/CalculadoraArancelesCAO.csproj -c Release -o publish

      - name: Deploy to Vercel
        run: |
          cd publish/wwwroot
          npx vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project-id=${{ secrets.VERCEL_PROJECT_ID }}