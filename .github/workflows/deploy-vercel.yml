name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore dependencies
        run: dotnet restore CalculadoraArancelesCAO.slnx

      - name: Build and Publish
        run: dotnet publish src/CalculadoraArancelesCAO/CalculadoraArancelesCAO.csproj -c Release -o publish

      # Se invoca la CLI de Vercel directamente en vez de usar amondnet/vercel-action:
      # esa action fija npx vercel@25.1.0 y las versiones antiguas no reconocen los
      # tokens actuales (vcp_), por lo que el deploy fallaba con "User not found".
      # VERCEL_ORG_ID y VERCEL_PROJECT_ID permiten vincular el proyecto sin vercel link.
      - name: Deploy to Vercel
        working-directory: ./publish/wwwroot
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest --prod --yes