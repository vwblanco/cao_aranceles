<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calculadora de Aranceles CAO</title>
    <base href="/" />
    <meta name="description" content="Calculadora de honorarios profesionales del Colegio de Arquitectos de Oruro conforme al Reglamento de Aranceles 2026 y la Ley N.° 1373." />
    <meta name="theme-color" content="#e67e22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aranceles CAO" />
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="CAO-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="CAO-512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="CAO-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="CAO-192.png" />
</head>

<body>
    <div id="app">
        <div class="cargando">
            <img src="CAO-192.png" height="64" alt="CAO" class="cargando-logo" />
            <div class="cargando-texto">Calculadora de Aranceles 2026</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Se produjo un error no controlado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <style>
        .cargando {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #e67e22;
        }

        .cargando-logo {
            width: 80px;
            height: 54px;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
        }

        .cargando-texto {
            margin-top: 0.9rem;
            font-size: 0.9rem;
        }

        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2000;
            background: #fee2e2;
            color: #7f1d1d;
            padding: 0.7rem 1.2rem;
            box-shadow: 0 -1px 6px rgb(0 0 0 / 12%);
        }
    </style>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="lib/html2pdf/html2pdf.bundle.min.js"></script>
    <script src="js/pdf.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
